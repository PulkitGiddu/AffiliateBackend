name: snatchmart_flutter
description: Production Flutter client for SnatchMart affiliate deals.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3
  # API
  dio: ^5.4.0
  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  # Navigation
  go_router: ^14.2.0
  # Local cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Utils
  equatable: ^2.0.5
  uuid: ^4.3.3
  intl: ^0.19.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  # Notifications (FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0
  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1
  pull_to_refresh: ^2.0.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  flutter_displaymode: ^0.6.0
  video_player: ^2.9.2
  image_picker: ^1.2.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3
  image: ^4.7.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/asserts/light.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/asserts/light.png"

flutter:
  uses-material-design: true
  assets:
    - lib/asserts/snatchmart.png
    - lib/asserts/logo1.png
    - lib/asserts/logo2.png
    - lib/asserts/light.png
    - lib/asserts/black.png
    - lib/asserts/logo_without_bg.png
    - lib/asserts/light_without_bg.png
    - lib/asserts/iconPack/
    - lib/asserts/sales/
    - lib/asserts/Offers/
    - lib/asserts/animation/
    - assets/mock_data.json
    - assets/lottie/
