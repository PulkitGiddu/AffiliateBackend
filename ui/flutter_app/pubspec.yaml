name: snatchmart_flutter
description: Production Flutter client for SnatchMart affiliate deals.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3
  # API
  dio: ^5.4.0
  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  # Navigation
  go_router: ^14.2.0
  # Local cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Utils
  equatable: ^2.0.5
  uuid: ^4.3.3
  intl: ^0.19.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  # Notifications (FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0
  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - lib/asserts/snatchmart.png
