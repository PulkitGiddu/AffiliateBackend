spring.application.name=snatchmart
server.port=8081

spring.profiles.active=dev

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5s
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

app.jwt.issuer=snatchmart
app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod-change-me-in-prod}
app.jwt.expiration=3600000

# Flipkart: when id/token are not set, dummy deals are used. To use live API, set in profile-specific props:
# flipkart.affiliate.id=...
# flipkart.affiliate.token=...

logging.level.root=INFO
logging.level.com.snatchmart.snatchmart=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId}] %logger{36} - %msg%n


